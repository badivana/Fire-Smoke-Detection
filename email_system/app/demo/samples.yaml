# Demo emails. All people, companies, domains and numbers are fictional.
# `expected` is the ground truth used by `python -m app.eval` (classification and
# extraction). It is never shown to the LLM. In `extract`, a list means "any of" and
# null means "must be null" (i.e. not invented).
#
# Each email: sender, to, subject, body_text and/or body_html, received_at, optional
# headers, labels, and attachments (fixture files in app/demo/fixtures/).

samples:
  - id: requirement_lab_pcs
    description: Complete department requirement (quantities, specs, budget, deadline)
    expected:
      category: REQUIREMENT
      needs_manual_review: false
      missing_information: []
      extract:
        department: [CSE, Computer Science]
        budget: "12,00,000"
        deadline: 15 October 2026
        items_count: 2
        quantities: [20, 20]
        missing_required: []
    email:
      sender: "Dr. Meera Kulkarni <hod.cse@greenfield-institute.example>"
      to: [it-admin@greenfield-institute.example]
      subject: "Requirement: 20 desktop PCs for new AI lab (CSE)"
      received_at: "2026-09-15T09:12:00+05:30"
      body_text: |
        Dear IT Admin,

        The CSE department requires the following for the new AI & ML lab (Room B-204):

        1. Desktop PCs - 20 units
           Specs: Intel Core i5 (13th gen) or equivalent, 16 GB RAM, 512 GB NVMe SSD,
           23.8" monitor, keyboard and mouse, Windows 11 Pro.
        2. UPS 1 kVA - 20 units

        Approved budget: INR 12,00,000 (including GST).
        Required by: 15 October 2026, before the odd-semester lab sessions start.

        Please arrange quotations from at least three vendors.

        Regards,
        Dr. Meera Kulkarni
        HOD, Computer Science & Engineering

  - id: requirement_missing_specs
    description: Vague requirement - no quantity, specs, budget or deadline
    expected:
      category: REQUIREMENT
      needs_manual_review: false
      missing_information: [quantity, technical_specifications, budget, deadline]
      extract:
        department: [Civil]
        budget: null
        technical_specifications: null
        quantities: [null]
        missing_includes: [quantity, budget, technical_specifications]
    email:
      sender: "Rahul Deshmukh <rahul.d@greenfield-institute.example>"
      to: [it-admin@greenfield-institute.example]
      subject: "projectors needed"
      received_at: "2026-09-16T14:40:00+05:30"
      body_text: |
        Hi,
        We need some projectors for the new classrooms in the civil block. Please do the
        needful asap.
        Thanks
        Rahul (Civil Dept office)

  - id: quotation_pdf
    description: Vendor quotation with a normal (text-layer) PDF attachment
    expected:
      category: VENDOR_QUOTATION
      needs_manual_review: false
      vendor: Acme Computers Pvt. Ltd.
      quotation_no: QTN-2026-0412
      total: "13,33,400.00"
      extract:
        vendor: [Acme]
        quotation_no: QTN-2026-0412
        total: "13,33,400"
        validity: 30 days
    email:
      sender: "Acme Computers Sales <sales@acme-computers.example>"
      to: [purchase@greenfield-institute.example]
      subject: "Quotation QTN-2026-0412 - Desktop PCs and UPS"
      received_at: "2026-09-18T11:05:00+05:30"
      body_text: |
        Dear Sir/Madam,

        With reference to your enquiry for the AI lab, please find attached our quotation
        QTN-2026-0412 for 20 desktop PCs and 20 UPS units.

        Grand total: INR 13,33,400 including 18% GST. The quotation is valid for 30 days.

        Warm regards,
        Sandeep Rao
        Acme Computers Pvt. Ltd.
      attachments:
        - filename: QTN-2026-0412.pdf
          mime_type: application/pdf
          fixture: quotation_acme.pdf

  - id: quotation_scanned
    description: Vendor quotation as a scanned PDF (no text layer; needs OCR)
    expected:
      category: VENDOR_QUOTATION
      needs_manual_review: false
      vendor: Brightline Projectors
      quotation_no: BL/Q/2291
      total: "2,88,156"
      # Until OCR exists (Phase 10) the scan is unreadable, so these MUST be null:
      # anything else would be invented. Phase 10 updates this expectation.
      extract:
        vendor: [Brightline]
        quotation_no: null
        total: null
        missing_includes: [quotation_no, total]
    email:
      sender: "Brightline Projectors <quotes@brightline-av.example>"
      to: [purchase@greenfield-institute.example]
      subject: "Quotation for projectors"
      received_at: "2026-09-19T16:22:00+05:30"
      body_text: |
        Dear Sir,
        Please find attached our quotation for LCD projectors as discussed.
        Regards,
        Brightline Projectors
      attachments:
        - filename: scan_0019.pdf
          mime_type: application/pdf
          fixture: quotation_scanned.pdf

  - id: invoice_network
    description: Vendor invoice for supplied network switches
    expected:
      category: INVOICE
      needs_manual_review: false
      extract:
        vendor: [NetCore]
        invoice_no: INV-7781
        po_reference: GIT/PO/2026/118
        total: "1,34,520"
        due_date: 20-10-2026
    email:
      sender: "NetCore Solutions Accounts <accounts@netcore-solutions.example>"
      to: [accounts@greenfield-institute.example, it-admin@greenfield-institute.example]
      subject: "Invoice INV-7781 for network switches (PO GIT/PO/2026/118)"
      received_at: "2026-09-20T10:00:00+05:30"
      body_text: |
        Dear Accounts Team,

        Please find below the invoice details for the network switches delivered on
        12 September 2026 against PO GIT/PO/2026/118.

        Invoice No: INV-7781
        Invoice date: 20-09-2026
        Items: 24-port managed Gigabit switch x 4 @ INR 28,500 = INR 1,14,000
        GST @ 18%: INR 20,520
        Total payable: INR 1,34,520
        Payment due: 20-10-2026

        Kindly process the payment to the bank account on file.

        Regards,
        Accounts, NetCore Solutions

  - id: technical_query_wifi
