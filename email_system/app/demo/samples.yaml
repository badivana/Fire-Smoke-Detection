      received_at: "2026-09-21T12:30:00+05:30"
      body_html: |
        <html><body>
        <p>Hello IT team,</p>
        <p>Since Monday the <b>GIT-Staff</b> Wi-Fi in the first-floor reading hall
        disconnects every 10-15 minutes. Students on <b>GIT-Student</b> report the same.
        Wired computers are fine.</p>
        <p>Could someone please check the access point?</p>
